# Copy to config.yaml and fill in. config.yaml is gitignored: it stays on the
# machine running the bot and never goes into the repo.

telegram:
  # Prefer setting the token via the TELEGRAM_BOT_TOKEN environment variable
  # (see deploy/wallet-bot.service). Only put it here for local testing.
  # token: "123456:ABC..."
  allowed_chat_id: 111111111   # your numeric Telegram chat id; the bot ignores everyone else

intervals:
  check_minutes: 30        # hourly scan: all-clear or low alert + heartbeat
  alert_check_minutes: 16  # extra fast check: silent unless a balance is below threshold

heartbeat:
  enabled: true          # one daily message with all balances, proves the bot is alive
  time: "09:00"
  timezone: "Asia/Singapore"

# Set to false to alert "below threshold" without exact amounts in Telegram.
show_amounts: true

# Stuck-withdrawal watch. Every transaction from an Ethereum address shares one
# nonce queue, so a single stuck (under-priced) transaction blocks all later ETH
# and ERC-20 withdrawals from that address. This watches the mined-vs-pending
# nonce gap and alerts (to the same chat and @tags as low-balance alerts) when the
# queue stops draining. Read-only: it never moves or replaces anything.
pending_alert:
  enabled: true
  check_minutes: 5       # how often to check
  stuck_minutes: 10      # alert only once the queue has been stuck this long
  realert_minutes: 30    # remind this often while it stays stuck
  allclear_hours: 4      # periodic "no stuck withdrawals" confirmation in hours (0 = off); also summarised in the daily heartbeat
  # addresses: leave empty to auto-watch every Ethereum (ETH/USDC/USDT) wallet
  # listed below. Set explicit addresses only if you need to override that.
  addresses: []

# One entry per address to watch. Labels must be unique; thresholds are in the
# asset's main unit (BTC, ETH, SOL, XRP, LTC). XRP balances are reported as
# spendable (total minus the XRPL reserve).
wallets:
  - label: BTC hot wallet
    asset: BTC
    address: bc1q...
    threshold: 0.5
  - label: ETH hot wallet
    asset: ETH
    address: "0x..."
    threshold: 5
  - label: SOL hot wallet
    asset: SOL
    address: "..."
    threshold: 50
  - label: XRP hot wallet
    asset: XRP
    address: r...
    threshold: 1000
  - label: LTC hot wallet
    asset: LTC
    address: ltc1q...
    threshold: 20
